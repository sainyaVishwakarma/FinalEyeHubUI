<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Final Eye Launcher</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f7fb;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .card {
        width: min(500px, 92vw);
        background: #fff;
        border: 1px solid #dce2ef;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
      }

      h1 {
        margin: 0 0 14px;
        font-size: 22px;
      }

      .field {
        display: grid;
        gap: 6px;
        margin-bottom: 12px;
      }

      label {
        font-size: 14px;
        color: #334155;
      }

      input {
        height: 36px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        padding: 0 10px;
        font-size: 14px;
      }

      button {
        margin-top: 6px;
        height: 38px;
        border: 1px solid #2563eb;
        border-radius: 6px;
        background: #2563eb;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        padding: 0 14px;
      }

      .hint {
        margin: 10px 0 0;
        color: #64748b;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Final Eye Process Launcher</h1>

      <div class="field">
        <label for="submissionId">Submission Id</label>
        <input id="submissionId" value="0107643" />
      </div>

      <div class="field">
        <label for="submissionName">Submission Name</label>
        <input id="submissionName" value="Sample Submission" />
      </div>

      <button id="goBtn" type="button">Go to Final Eye Process</button>
      <p class="hint">
        This redirects to FinalEyeHub with query params.
      </p>
    </main>

    <script>
      // Change this if your FinalEyeHub runs on a different URL.
      const FINAL_EYE_HUB_URL = 'http://localhost:5173';

      const submissionIdInput = document.getElementById('submissionId');
      const submissionNameInput = document.getElementById('submissionName');
      const goBtn = document.getElementById('goBtn');

      goBtn.addEventListener('click', () => {
        const submissionId = submissionIdInput.value.trim();
        const submissionName = submissionNameInput.value.trim();

        if (!submissionId) {
          alert('Please enter Submission Id.');
          return;
        }

        const targetUrl =
          `${FINAL_EYE_HUB_URL.replace(/\/$/, '')}/?` +
          `submissionId=${encodeURIComponent(submissionId)}` +
          `&submissionName=${encodeURIComponent(submissionName)}`;

        window.location.href = targetUrl;
      });
    </script>
  </body>
</html>
